name: Validar estrutura e isolamento
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integridade e isolamento dos modos
        run: python .qa/validate_site.py
      - name: Testes econômicos e UX do Level 1
        run: node .qa/test_level1_ui.cjs
      - name: Auditoria quantitativa do scorecard L1
        run: node .qa/test_level1_score.cjs
      - name: Preparar Chrome e Selenium
        if: github.event_name == 'pull_request'
        run: python -m pip install selenium
      - name: Testar o Level 1 em navegador real
        if: github.event_name == 'pull_request'
        run: python .qa/browser_smoke.py
      - name: Registrar capturas da interface
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trading-games-level1-ux
          path: test-artifacts/
          if-no-files-found: ignore
